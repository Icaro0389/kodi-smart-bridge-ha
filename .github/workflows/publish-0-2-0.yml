name: Publish Kodi Smart Bridge Integration v0.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0-2-0.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 'v0.2.0' >/dev/null 2>&1 && exit 0
          gh release create 'v0.2.0' --target "${GITHUB_SHA}" --title 'Kodi Smart Bridge Integration v0.2.0' --notes 'Adds admin-only WebSocket commands for native Kodi favourites. Requires Kodi Smart Bridge App v0.2.0.' --latest
