name: Validate favourite integration
on:
  push:
    branches: [feature/kodi-native-favourites]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q custom_components/kodi_smart_bridge
